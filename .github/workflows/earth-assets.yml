name: Build NASA Earth Assets

on:
  push:
    branches:
      - redesign/final-1to1-2026
    paths:
      - .github/workflows/earth-assets.yml

permissions:
  contents: write

jobs:
  build-earth-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: redesign/final-1to1-2026

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Download official NASA textures
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .earth-source public/earth
          curl -L --fail --retry 4 --retry-delay 2 \
            "https://eoimages.gsfc.nasa.gov/images/imagerecords/73000/73776/world.topo.bathy.200408.3x5400x2700.jpg" \
            -o .earth-source/day.jpg
          curl -L --fail --retry 4 --retry-delay 2 \
            "https://assets.science.nasa.gov/content/dam/science/esd/eo/images/imagerecords/144000/144898/BlackMarble_2016_01deg.jpg" \
            -o .earth-source/night.jpg
          curl -L --fail --retry 4 --retry-delay 2 \
            "https://eoimages.gsfc.nasa.gov/images/imagerecords/57000/57747/cloud_combined_2048.jpg" \
            -o .earth-source/clouds.jpg

      - name: Optimize textures for the web
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageEnhance

          src = Path('.earth-source')
          out = Path('public/earth')
          out.mkdir(parents=True, exist_ok=True)

          # Day: preserve real NASA color, only resize and very gently increase contrast.
          day = Image.open(src / 'day.jpg').convert('RGB')
          day.thumbnail((4096, 2048), Image.Resampling.LANCZOS)
          day = ImageEnhance.Contrast(day).enhance(1.04)
          day.save(out / 'earth-day.webp', 'WEBP', quality=84, method=6)

          # Night: Black Marble already contains the real city-light distribution.
          night = Image.open(src / 'night.jpg').convert('RGB')
          night.save(out / 'earth-night.webp', 'WEBP', quality=86, method=6)

          # Clouds: monochrome NASA cloud mosaic; shader treats luminance as alpha.
          clouds = Image.open(src / 'clouds.jpg').convert('L')
          clouds = ImageEnhance.Contrast(clouds).enhance(1.08)
          clouds.save(out / 'earth-clouds.webp', 'WEBP', quality=82, method=6)
          PY

      - name: Add source manifest
        shell: bash
        run: |
          cat > public/earth/SOURCES.md <<'EOF'
          # Earth texture sources

          These web-optimized textures are derived from official NASA imagery.

          - `earth-day.webp` — NASA Visible Earth, August Blue Marble Next Generation with topography and bathymetry (August 2004).
            Source: https://eoimages.gsfc.nasa.gov/images/imagerecords/73000/73776/world.topo.bathy.200408.3x5400x2700.jpg
          - `earth-night.webp` — NASA Earth Observatory / Black Marble, 2016 global night lights.
            Source: https://assets.science.nasa.gov/content/dam/science/esd/eo/images/imagerecords/144000/144898/BlackMarble_2016_01deg.jpg
          - `earth-clouds.webp` — NASA Visible Earth, Blue Marble cloud mosaic.
            Source: https://eoimages.gsfc.nasa.gov/images/imagerecords/57000/57747/cloud_combined_2048.jpg

          The originals are not committed; only web-optimized derivatives are stored in this repository.
          EOF

      - name: Commit generated assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/earth
          if git diff --cached --quiet; then
            echo "Earth assets already up to date."
            exit 0
          fi
          git commit -m "Add optimized NASA Earth textures"
          git push origin HEAD:redesign/final-1to1-2026
