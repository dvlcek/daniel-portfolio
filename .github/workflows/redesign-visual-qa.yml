name: Redesign Visual QA

on:
  push:
    branches:
      - redesign/final-1to1-2026
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-screenshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Install Playwright Chromium
        run: npx --yes playwright@1.55.0 install --with-deps chromium
      - name: Start production server
        run: |
          npm run start > /tmp/daniel-portfolio.log 2>&1 &
          for i in {1..45}; do
            if curl --fail --silent http://127.0.0.1:3000 > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/daniel-portfolio.log
          exit 1
      - name: Capture desktop and mobile
        run: |
          mkdir -p visual-qa
          npx --yes playwright@1.55.0 screenshot --browser=chromium --viewport-size="1440,900" --full-page --wait-for-timeout=2500 http://127.0.0.1:3000 visual-qa/home-desktop-1440.png
          npx --yes playwright@1.55.0 screenshot --browser=chromium --viewport-size="390,844" --full-page --wait-for-timeout=2500 http://127.0.0.1:3000 visual-qa/home-mobile-390.png
      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: redesign-visual-qa
          path: visual-qa/*.png
          if-no-files-found: error
          retention-days: 7
